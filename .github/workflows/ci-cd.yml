name: CI and CD

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mfbo-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.7.5"
          enable-cache: true
      - run: uv sync --frozen --all-extras
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy src
      - run: uv run pytest --cov=mfbo_platform --cov-report=xml
      - name: Dependency vulnerability scan
        uses: aquasecurity/trivy-action@0.32.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  container-build:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.7.5"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.api
          push: false
          tags: mfbo-api:${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.worker
          target: public-worker
          push: false
          tags: mfbo-worker:${{ github.sha }}
          cache-from: type=gha,scope=worker
          cache-to: type=gha,mode=max,scope=worker
      - name: Run the API, real Azure storage adapters, worker and MLflow
        run: |
          uv sync --frozen --all-extras
          docker compose up -d --build --wait --wait-timeout 180
          uv run python scripts/smoke_stack.py --output benchmark-results/ci-compose-smoke.json
      - name: Exercise Blob concurrency through the actual Azure SDK
        env:
          MFBO_TEST_AZURITE: "DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=bm90LWEtcHJvZHVjdGlvbi1jcmVkZW50aWFs;BlobEndpoint=http://127.0.0.1:11000/devstoreaccount1;QueueEndpoint=http://127.0.0.1:11001/devstoreaccount1"
        run: uv run pytest tests/test_azure_integration.py
      - name: Container diagnostics
        if: failure()
        run: docker compose logs --tail=100
      - name: Stop test containers
        if: always()
        run: docker compose down

  infrastructure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: az bicep build --file infra/bicep/main.bicep --outfile /tmp/mfbo.json

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.MFBO_ENABLE_DEPLOY == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [container-build, infrastructure]
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.7.5"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Read infrastructure outputs
        id: infra
        shell: bash
        run: |
          {
            echo "acr=$(az deployment sub show --name '${{ vars.AZURE_DEPLOYMENT_NAME }}' --query properties.outputs.acrLoginServer.value -o tsv)"
            echo "aks=$(az deployment sub show --name '${{ vars.AZURE_DEPLOYMENT_NAME }}' --query properties.outputs.aksName.value -o tsv)"
            echo "resource_group=$(az deployment sub show --name '${{ vars.AZURE_DEPLOYMENT_NAME }}' --query properties.outputs.resourceGroupName.value -o tsv)"
            echo "storage_url=$(az deployment sub show --name '${{ vars.AZURE_DEPLOYMENT_NAME }}' --query properties.outputs.storageAccountUrl.value -o tsv)"
            echo "vault=$(az deployment sub show --name '${{ vars.AZURE_DEPLOYMENT_NAME }}' --query properties.outputs.keyVaultName.value -o tsv)"
            echo "workload_client=$(az deployment sub show --name '${{ vars.AZURE_DEPLOYMENT_NAME }}' --query properties.outputs.workloadClientId.value -o tsv)"
          } >> "$GITHUB_OUTPUT"
      - name: Check release configuration and running cluster
        env:
          ACR: ${{ steps.infra.outputs.acr }}
          AKS: ${{ steps.infra.outputs.aks }}
          RESOURCE_GROUP: ${{ steps.infra.outputs.resource_group }}
          TARGET_PLATFORM: ${{ vars.TARGET_PLATFORM }}
        run: |
          set -euo pipefail
          case "$TARGET_PLATFORM" in linux/arm64|linux/amd64) ;; *) echo 'Set TARGET_PLATFORM explicitly'; exit 1;; esac
          test "$(az aks show -g "$RESOURCE_GROUP" -n "$AKS" --query powerState.code -o tsv)" = Running
          az acr login --name "${ACR%%.*}"
      - name: Build and push API
        id: api
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.api
          platforms: ${{ vars.TARGET_PLATFORM }}
          push: true
          tags: ${{ steps.infra.outputs.acr }}/mfbo-api:${{ github.sha }}
      - name: Build and push demo worker
        id: worker
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.worker
          target: public-worker
          platforms: ${{ vars.TARGET_PLATFORM }}
          push: true
          tags: ${{ steps.infra.outputs.acr }}/mfbo-worker:${{ github.sha }}
      - name: Build and push tracking service
        id: tracking
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.worker
          target: public-worker
          platforms: ${{ vars.TARGET_PLATFORM }}
          push: true
          tags: ${{ steps.infra.outputs.acr }}/mfbo-tracking:${{ github.sha }}
      - name: Deploy to AKS
        env:
          ACR: ${{ steps.infra.outputs.acr }}
          AKS: ${{ steps.infra.outputs.aks }}
          RESOURCE_GROUP: ${{ steps.infra.outputs.resource_group }}
          STORAGE_URL: ${{ steps.infra.outputs.storage_url }}
          VAULT: ${{ steps.infra.outputs.vault }}
          WORKLOAD_CLIENT: ${{ steps.infra.outputs.workload_client }}
          API_DIGEST: ${{ steps.api.outputs.digest }}
          TRACKING_DIGEST: ${{ steps.tracking.outputs.digest }}
          WORKER_DIGEST: ${{ steps.worker.outputs.digest }}
        run: |
          set -euo pipefail
          az aks get-credentials --resource-group "$RESOURCE_GROUP" --name "$AKS" --overwrite-existing
          python scripts/render_k8s.py \
            --api-image "$ACR/mfbo-api@$API_DIGEST" \
            --worker-image "$ACR/mfbo-worker@$WORKER_DIGEST" \
            --tracking-image "$ACR/mfbo-tracking@$TRACKING_DIGEST" \
            --storage-url "$STORAGE_URL" \
            --client-id "$WORKLOAD_CLIENT" \
            --tenant-id '${{ vars.AZURE_TENANT_ID }}' \
            --key-vault "$VAULT" \
            --output /tmp/mfbo-azure.yaml
          kubectl apply -f /tmp/mfbo-azure.yaml
          kubectl rollout status deployment/mfbo-api -n mfbo --timeout=5m
          kubectl rollout status deployment/mfbo-worker -n mfbo --timeout=10m
          kubectl rollout status deployment/mfbo-mlflow -n mfbo --timeout=5m
          uv sync --frozen --all-extras
          kubectl port-forward -n mfbo service/mfbo-api 18000:80 &
          api_tunnel=$!
          kubectl port-forward -n mfbo service/mfbo-mlflow 15501:5000 &
          tracking_tunnel=$!
          trap 'kill "$api_tunnel" "$tracking_tunnel" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:18000/ready && curl -fsS http://127.0.0.1:15501/health; then break; fi
            echo "Waiting for local release-check tunnels ($attempt/30)"
            sleep 2
          done
          uv run python scripts/verify_aks.py --kubeconfig "$HOME/.kube/config" \
            --mlflow-url http://127.0.0.1:15501 --output benchmark-results/aks-release
      - name: Save sanitized release evidence
        uses: actions/upload-artifact@v4
        with:
          name: aks-release-${{ github.sha }}
          path: |
            benchmark-results/aks-release/smoke.json
            benchmark-results/aks-release/workloads.json
          if-no-files-found: error
