name: azure-ml-optimization-public
services:
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:3.35.0
    command: azurite --blobHost 0.0.0.0 --queueHost 0.0.0.0
    environment:
      # Explicit emulator-only account; never use this value for cloud storage.
      AZURITE_ACCOUNTS: "devstoreaccount1:bm90LWEtcHJvZHVjdGlvbi1jcmVkZW50aWFs"
    ports:
      - "127.0.0.1:${MFBO_BLOB_PORT:-11000}:10000"
      - "127.0.0.1:${MFBO_QUEUE_PORT:-11001}:10001"
    healthcheck:
      test: ["CMD", "node", "-e", "const s=require('net').connect(10001,'127.0.0.1');s.on('connect',()=>{s.end();process.exit(0)});s.on('error',()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - azurite-data:/data

  mlflow:
    build:
      context: .
      dockerfile: Dockerfile.worker
      target: public-worker
    command:
      - mlflow
      - server
      - --host=0.0.0.0
      - --port=5000
      - --backend-store-uri=sqlite:////mlflow/mlflow.db
      - --artifacts-destination=/mlflow/artifacts
      - --serve-artifacts
      - --allowed-hosts=localhost:*,127.0.0.1:*,mlflow:5000
    environment:
      MLFLOW_DISABLE_TELEMETRY: "true"
    user: "0:0"
    ports:
      - "127.0.0.1:${MFBO_MLFLOW_PORT:-15500}:5000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health',timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 30
    volumes:
      - mlflow-data:/mlflow

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment: &platform-environment
      MFBO_ENVIRONMENT: local
      MLFLOW_DISABLE_TELEMETRY: "true"
      MFBO_QUEUE_BACKEND: azure_queue
      MFBO_QUEUE_VISIBILITY_TIMEOUT_SECONDS: ${MFBO_QUEUE_VISIBILITY_TIMEOUT_SECONDS:-120}
      MFBO_AZURE_STORAGE_CONNECTION_STRING: >-
        DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=bm90LWEtcHJvZHVjdGlvbi1jcmVkZW50aWFs;BlobEndpoint=http://azurite:10000/devstoreaccount1;QueueEndpoint=http://azurite:10001/devstoreaccount1
      MFBO_REPOSITORY_BACKEND: ${MFBO_REPOSITORY_BACKEND:-azure_blob}
      MFBO_STATE_PATH: /shared/state
      MFBO_ARTIFACT_BACKEND: ${MFBO_ARTIFACT_BACKEND:-azure_blob}
      MFBO_ARTIFACT_PATH: /shared/artifacts
      MFBO_ENGINE_BACKEND: demo
      MFBO_MLFLOW_TRACKING_URI: http://mlflow:5000
    ports:
      - "127.0.0.1:${MFBO_API_PORT:-18080}:8000"
    volumes:
      - platform-data:/shared
    depends_on:
      azurite:
        condition: service_healthy
      mlflow:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
      target: public-worker
    environment:
      <<: *platform-environment
      MFBO_WORKER_ID: compose-worker-1
    volumes:
      - platform-data:/shared
    depends_on:
      azurite:
        condition: service_healthy
      mlflow:
        condition: service_healthy

volumes:
  azurite-data:
  mlflow-data:
  platform-data:
